[build]
builder = "DOCKERFILE"

[build.args]
PHOTON_JAR_VERSION = "1.1.0"
PHOTON_VERSION = "1.0"
JAVA_OPTS = "-Xmx2G"

[deploy]
# Photon tarda en arrancar el primer boot (descarga de datos)
# healthcheckTimeout cubre ese tiempo de espera
healthcheckPath = "/api?q=Santiago"
healthcheckTimeout = 1800    # 30 minutos para el primer boot con descarga

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
